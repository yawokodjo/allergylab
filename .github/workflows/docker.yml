name: AllergyLab CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          cd Part7a
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-app:latest ./app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest ./db-loader
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-email:latest ./email

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/al-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/al-email:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Stop previous containers if they exist
        run: |
          docker rm -f al-app al-db-loader al-email >/dev/null 2>&1 || true

      - name: Run app containers
        run: |
          docker run -d --name al-app -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/al-app:latest
          docker run -d --name al-db-loader ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest
          docker run -d --name al-email -p 8025:25 ${{ secrets.DOCKER_USERNAME }}/al-email:latest